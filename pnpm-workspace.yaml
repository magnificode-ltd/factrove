packages:
  - apps/*
  - packages/*
engineStrict: true
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  core-js: false
  esbuild: true
  prisma: true
  sharp: true
overrides:
  '@prisma/client': 6.19.0
  prisma: 6.19.0
minimumReleaseAgeExclude:
  - nodemailer@10.2.1
