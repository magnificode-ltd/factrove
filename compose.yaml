# Local Factrove infrastructure.
# PostgreSQL stores metadata. Garage stores artifact bytes for local development.
# Leave S3_ENDPOINT unset to use real AWS S3 instead of this Garage service.
# The digests are official multi-arch image indexes (linux/amd64 and linux/arm64),
# so Apple Silicon and Intel Macs each pull their own build.

name: factrove

services:
  postgres:
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: factrove
      POSTGRES_PASSWORD: factrove
      POSTGRES_DB: factrove
    volumes:
      - factrove-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factrove -d factrove"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  garage:
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    ports:
      - "127.0.0.1:3900:3900"
    environment:
      GARAGE_RPC_SECRET: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      GARAGE_DEFAULT_ACCESS_KEY: factrove-local
      GARAGE_DEFAULT_SECRET_KEY: factrove-local-secret
      GARAGE_DEFAULT_BUCKET: factrove
    volumes:
      - ./infra/garage.toml:/etc/garage.toml:ro
      - factrove-garage-meta:/var/lib/garage/meta
      - factrove-garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  factrove-postgres:
  factrove-garage-meta:
  factrove-garage-data:
