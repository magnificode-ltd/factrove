name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  cla:
    # v2.6.1 matches allowlist entries against committer.login or the git
    # author name, so an unlinked commit named like a maintainer would pass.
    # Exempt only the GitHub account that opened the pull request.
    if: >-
      !contains(fromJSON('["tommagni","dependabot[bot]","cursor[bot]","cursoragent"]'), github.event.pull_request.user.login) &&
      !contains(fromJSON('["tommagni","dependabot[bot]","cursor[bot]","cursoragent"]'), github.event.issue.user.login)
    runs-on: ubuntu-latest
    steps:
      # v2.6.1 reads commits(first: 100) once and only the first page of comments.
      - name: Reject pull requests the CLA action cannot fully read
        if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          number="${PR_NUMBER:-}"
          if [ -z "${number}" ]; then
            number="${ISSUE_NUMBER:-}"
          fi
          case "${number}" in
            ''|*[!0-9]*)
              printf '%s\n' 'CLA check needs a numeric pull request number.'
              exit 1
              ;;
          esac
          if [[ ! "${REPO}" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            printf '%s\n' 'CLA check needs an owner/repository name.'
            exit 1
          fi
          counts="$(gh api --jq '.commits, .comments' "repos/${REPO}/pulls/${number}")"
          commits="${counts%%$'\n'*}"
          comments="${counts#*$'\n'}"
          if [ "${commits}" = "${counts}" ]; then
            printf '%s\n' 'CLA check could not read the commit and comment counts.'
            exit 1
          fi
          case "${commits}" in
            ''|*[!0-9]*)
              printf '%s\n' 'CLA check could not read the commit count.'
              exit 1
              ;;
          esac
          case "${comments}" in
            ''|*[!0-9]*)
              printf '%s\n' 'CLA check could not read the comment count.'
              exit 1
              ;;
          esac
          if [ "$((10#${commits}))" -gt 100 ] || [ "$((10#${comments}))" -gt 30 ]; then
            commit_label="commits"
            comment_label="comments"
            if [ "$((10#${commits}))" -eq 1 ]; then
              commit_label="commit"
            fi
            if [ "$((10#${comments}))" -eq 1 ]; then
              comment_label="comment"
            fi
            printf '::error::This pull request has %s %s and %s %s. CLA Assistant Lite only reads the first 100 commits and the first 30 comments, so this check cannot see every author or signature. A maintainer must verify CLA status manually, or the contributor should split the pull request.\n' \
              "${commits}" "${commit_label}" "${comments}" "${comment_label}"
            exit 1
          fi
      - name: CLA Assistant
        if: >-
          success() &&
          (github.event_name == 'pull_request_target' || github.event.issue.pull_request) &&
          (
            github.event_name == 'pull_request_target' ||
            github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
          )
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/magnificode-ltd/factrove/blob/main/CLA.md
          branch: cla-signatures
