name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  cla:
    # v2.6.1 matches allowlist entries against committer.login or the git
    # author name, so an unlinked commit named like a maintainer would pass.
    # Exempt only the GitHub account that opened the pull request.
    if: >-
      !contains(fromJSON('["tommagni","dependabot[bot]","cursor[bot]","cursoragent"]'), github.event.pull_request.user.login) &&
      !contains(fromJSON('["tommagni","dependabot[bot]","cursor[bot]","cursoragent"]'), github.event.issue.user.login)
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          (github.event_name == 'pull_request_target' || github.event.issue.pull_request) &&
          (
            github.event_name == 'pull_request_target' ||
            github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
          )
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/magnificode-ltd/factrove/blob/main/CLA.md
          branch: cla-signatures
