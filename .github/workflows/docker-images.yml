name: Docker images

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build --target api --tag factrove-api:ci .
      - name: Build the web image
        run: docker build --target web --tag factrove-web:ci .
